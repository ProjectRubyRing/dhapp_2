# =============================================================================
# jp/iwin/tango/date_config.properties  ―― ★リソース読み用（war 同梱）
# -----------------------------------------------------------------------------
# このファイルは war のアーカイブ対象として事前に取り込まれ、
# デプロイ後は WEB-INF/classes/jp/iwin/tango/date_config.properties に配置される。
# GET /api/config/date-config が「リソース読み」でこの内容を読み取る。
#
# 一方「ファイル読み」の対象は AP サーバのファイルシステム上にある
#   /webapp/webapp9mf02/serverlets/jp/iwin/tango/date_config.properties
# であり、war の外側にある別ファイル。両者を読み比べることで
#   ・ファイル読みとリソース読みで同じ内容が取得できているか
#   ・JBoss EAP の deployment-overlay でリソース側だけが差し替わっていないか
# を確認する。
#
# source / revision は「どちらの経路で読んだ値か」を目視で判別するための目印なので、
# ファイル読み側（war の外）とは意図的に異なる値にしておくとよい。
# =============================================================================

# どの経路で読み込まれた設定かを示す目印
config.source=classpath:jp/iwin/tango/date_config.properties (WEB-INF/classes in dhapp.war)
config.origin=war-archive
config.revision=1

# 日付関連の設定値
date.format=yyyy-MM-dd
date.time.format=yyyy-MM-dd HH:mm:ss.SSS
date.timezone=Asia/Tokyo
date.locale=ja_JP
date.calendar=gregorian

# 業務日付の調整
business.date.offset.days=0
business.date.rollover.hour=5

# 月次締め
closing.day.of.month=末日
closing.timezone=Asia/Tokyo
