# =============================================================================
# date_config.properties  ―― ★ファイル読み用のサンプル（war の外）
# -----------------------------------------------------------------------------
# GET /api/config/date-config の「ファイル読み」が対象にする
#   /webapp/webapp9mf02/servlets/jp/iwin/base/tango/date_config.properties
# のサンプル。AP サーバ上に次のように配置して使う。
#
#   cp -r samples/webapp /
#   chown -R jboss:jboss /webapp        # EAP の実行ユーザーが読めるようにする
#
# 別の場所に置く場合は環境変数 DATE_CONFIG_FILE_PATH で実際のパスを指定する。
#
# war 同梱の src/main/resources/jp/iwin/base/tango/date_config.properties とは
# config.source / config.origin / config.revision を意図的に変えてあるので、
# API のレスポンス（comparison.differentValues）で
# 「どちらの経路で読んだ値か」がそのまま見分けられる。
# =============================================================================

# どの経路で読み込まれた設定かを示す目印
config.source=file:/webapp/webapp9mf02/servlets/jp/iwin/base/tango/date_config.properties
config.origin=filesystem
config.revision=1

# 日付関連の設定値
date.format=yyyy-MM-dd
date.time.format=yyyy-MM-dd HH:mm:ss.SSS
date.timezone=Asia/Tokyo
date.locale=ja_JP
date.calendar=gregorian

# 業務日付の調整
business.date.offset.days=0
business.date.rollover.hour=5

# 月次締め
closing.day.of.month=末日
closing.timezone=Asia/Tokyo
