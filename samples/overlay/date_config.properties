# =============================================================================
# date_config.properties  ―― ★deployment-overlay で差し替える側のサンプル
# -----------------------------------------------------------------------------
# war の中の WEB-INF/classes/jp/iwin/tango/date_config.properties を、
# war を作り直さずにこのファイルで差し替えるためのサンプル。
#
#   cp samples/overlay/date_config.properties /opt/overlay/date_config.properties
#   $JBOSS_HOME/bin/jboss-cli.sh --connect \
#       --file=wildfly/configure-date-config-overlay.cli
#
# 反映後にもう一度 GET /api/config/date-config を呼ぶと、
#   deploymentOverlay.dateConfigOverlayDefined = true
#   deploymentOverlay.resourceContentChanged   = true   ← 差し替えが効いた証拠
# となり、リソース読み側の config.origin / config.revision が
# 下の値に変わっていることが確認できる。
# =============================================================================

# どの経路で読み込まれた設定かを示す目印（overlay で差し替えられたことが分かる値）
config.source=deployment-overlay:/opt/overlay/date_config.properties
config.origin=deployment-overlay
config.revision=2

# 日付関連の設定値（overlay で変更した想定の値）
date.format=yyyy/MM/dd
date.time.format=yyyy/MM/dd HH:mm:ss.SSS
date.timezone=Asia/Tokyo
date.locale=ja_JP
date.calendar=gregorian

# 業務日付の調整
business.date.offset.days=1
business.date.rollover.hour=5

# 月次締め
closing.day.of.month=末日
closing.timezone=Asia/Tokyo
